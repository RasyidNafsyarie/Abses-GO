{% extends "base.html" %}

{% block title %}Masuk — Absensi GO{% endblock %}

{% block body %}
<div class="auth-page">
  <main class="auth-card card fade-in">
    <div class="brand auth-brand">
      <span class="brand-mark" data-lucide="graduation-cap"></span>
      <span>Absensi GO</span>
    </div>

    <div class="auth-head">
      <h1>Masuk</h1>
      <p>Pilih peran untuk melanjutkan</p>
    </div>

    <!-- Role selection -->
    <div class="role-tabs" role="tablist" aria-label="Pilih peran">
      <button type="button" id="tab-siswa" class="role-tab" role="tab" aria-selected="true" onclick="LoginApp.selectRole('siswa')">
        <i data-lucide="user-round"></i> Siswa
      </button>
      <button type="button" id="tab-guru" class="role-tab" role="tab" aria-selected="false" onclick="LoginApp.selectRole('guru')">
        <i data-lucide="users"></i> Guru
      </button>
    </div>

    <!-- Login siswa -->
    <form id="form-siswa" class="auth-form" onsubmit="LoginApp.submit(event, 'siswa')" novalidate>
      <div class="field">
        <label for="username-siswa">Nama / Username</label>
        <input type="text" id="username-siswa" class="input" placeholder="contoh: budi" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password-siswa">Password</label>
        <input type="password" id="password-siswa" class="input" placeholder="••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btn-login-siswa" class="btn btn-primary btn-block">Masuk sebagai Siswa</button>
      <p class="form-note" id="note-siswa"></p>
    </form>

    <!-- Login guru -->
    <form id="form-guru" class="auth-form hidden" onsubmit="LoginApp.submit(event, 'guru')" novalidate>
      <div class="field">
        <label for="username-guru">Username</label>
        <input type="text" id="username-guru" class="input" placeholder="contoh: pakdoni" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password-guru">Password</label>
        <input type="password" id="password-guru" class="input" placeholder="••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btn-login-guru" class="btn btn-primary btn-block">Masuk sebagai Guru</button>
      <p class="form-note" id="note-guru"></p>
    </form>

    <footer class="auth-foot">
      <p>Akun demo — Siswa: <code>budi</code>/<code>1234</code> · Guru: <code>pakdoni</code>/<code>1234</code></p>
    </footer>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
